# Private repository minutes cost money: every push runs the fast tests and the real-notebook test
# on Linux only; Windows and macOS run by hand and on version tags.
name: test
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MichaelZelbel/godspeed-mission-control
          path: product
      # Outside this repository, or the product's CommonJS tools would read this package.json's
      # "type": "module" and the notebook would not start.
      - run: mv product "$RUNNER_TEMP/product"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19"
      - run: node --test "test/*.test.mjs"
        env:
          GODSPEED_NOTEBOOK_CHECKOUT: ${{ runner.temp }}/product
  others:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test "test/*.test.mjs"
